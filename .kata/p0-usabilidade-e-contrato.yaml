task: p0-usabilidade-e-contrato
status: approved
domain: coding
done: >
  Os oito achados P0 do relatório REVISAO-USABILIDADE.md implementados e
  verificados: SIGPIPE corrigido no dispatcher; Python declarado/checado;
  dogu-make-skill registrado com --version e SKILL.md gerado; oito metadados
  corrigidos; dependências modeladas com deps_any/deps_python/deps_optional;
  guards de TTY em env-manager, lab-manager e menu-launcher; cores
  desativadas automaticamente fora de TTY e NO_COLOR respeitado; --json
  adicionado aos nove scripts analíticos. Verificação: shellcheck, bash -n,
  smoke tests de --help/--version/--json, jq em todas as saídas JSON e
  nenhuma regressão nas verificações do projeto.
base_commit: "d0470342e0da8d12aa8dbdcab65a084731dead39"
approved_commit: "d0cebac11725bce256c9b6b8fb9a1dbe8038e781"
fit:
  trivial: false
  route: code-loop
  reason: >
    Implementação de oito achados P0 já priorizados e com escopo definido no
    relatório; o usuário autorizou a implementação. Há mudanças em múltiplos
    scripts, manifesto, dispatcher, instalador e documentação.
  answered: true
  skipped: false
think:
  problem: >
    O portfólio tem contratos de CLI quebrados em pontos de alto impacto:
    dispatcher com SIGPIPE e dependência não declarada de Python, gerador de
    skill invisível, oito metadados divergentes, dependências mal modeladas,
    prompts sem guard de TTY, cores em pipes e ausência de JSON em nove
    scripts analíticos. Esses problemas quebram automação, confundem agentes e
    tornam a instalação frágil.
  assumptions:
    - "A correção deve preservar compatibilidade: nomes, flags e saídas humanas atuais continuam funcionando."
    - "Não introduzir dependência nova obrigatória; JSON será gerado com Bash/printf e escapes locais."
    - "O instalador pode exigir Python para o dispatcher, desde que avise claramente; os scripts continuam Bash."
    - "Cores só em TTY; NO_COLOR continua tendo precedência."
    - "Guards de TTY devem permitir --help/--version e falhar com mensagem acionável."
  alternatives:
    - "Fallback completo do dispatcher para jq/awk — descartado nesta rodada: reescrever o parser JSON é maior que o escopo e mais arriscado."
    - "Adicionar --no-color em cada um dos 104 scripts — descartado: mudança repetitiva e arriscada nos parsers; NO_COLOR + detecção de TTY resolve o problema real, e o dispatcher ganha --no-color."
    - "Adicionar --json com schema genérico {output: ...} — descartado: não é saída estruturada útil."
    - "Corrigir apenas os scripts mais usados — descartado: o usuário pediu todos os P0."
  unknowns: |
    RESOLVIDO:
    1. Como o dispatcher monta JSON? → snippets Python; um wrapper py() com SIGPIPE default resolve todos.
    2. O instalador já verifica Python? → não; adicionar checagem e mensagem.
    3. O gerador de SKILL tem versão? → não; adicionar.
    4. Quais scripts precisam de --json? → os nove listados no relatório.
    NÃO BLOQUEIA: o schema de cada JSON será o mínimo útil observável na saída atual.
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  notes: >
    Sem novas abstrações além de helpers locais reutilizados (py, json_escape).
    Sem configurabilidade especulativa; os campos novos do manifesto são
    exigidos pelos achados P0-04/P0-05.
  answered: true
  skipped: false
intent:
  code_does: "Dispatchers e scripts produzem os mesmos resultados humanos de antes, com correções de contrato e novos modos JSON."
  check_expects: "shellcheck/bash -n continuam verdes; --help/--version não quebram; --json produz JSON válido; pipes não recebem ANSI."
  spec_says: "AGENTS.md e SCRIPTING_GUIDE.md exigem --help, --version, set -euo pipefail, NO_COLOR, guards de TTY e registro no manifesto."
  all_agree: true
  conflict_resolution: ""
  answered: true
  skipped: false
