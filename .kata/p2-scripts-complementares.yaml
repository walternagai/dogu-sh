task: p2-scripts-complementares
status: approved
domain: coding
done: >
  Os scripts novos do P2 implementados, registrados e verificados:
  video-to-text, pdf-split, pdf-merge, image-optimizer, ssl-cert-check,
  docker-doctor, json-yaml-tool, cron-manager, http-server,
  dotfiles-manager e file-watcher. Todos com --help/--version, manifesto,
  menu, README e SKILL.md; modificadores com --dry-run; analíticos com
  --json quando aplicável. Verificação: shellcheck, bash -n, smoke tests
  individuais e doctor 116/116.
