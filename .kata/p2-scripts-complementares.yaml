fit:
  trivial: false
  route: code-loop
  reason: >
    Onze scripts novos em três ondas, com registro em manifesto/menu/README,
    dependências variadas e necessidade de smoke tests. Escopo aprovado pelo
    pedido direto de execução do P2.
  answered: true
  skipped: false
think:
  problem: >
    O portfólio não cobre fluxos pedidos com frequência: vídeo para texto,
    divisão/junção de PDF, otimização de imagens, checagem de TLS, diagnóstico
    agregado de Docker, manipulação JSON/YAML, agendamento, servidor HTTP local,
    gestão de dotfiles e observação de arquivos. Hoje esses fluxos exigem
    combinar ferramentas externas manualmente.
  assumptions:
    - "Cada script deve ser útil sozinho e compor com os existentes, sem duplicar lógica."
    - "Dependências devem ser checadas pelo dependency-helper e declaradas no manifesto."
    - "Modificadores devem ter --dry-run e confirmação; analíticos devem ter --json quando fizer sentido."
    - "Portabilidade Linux/macOS: evitar flags GNU-only quando houver alternativa simples."
    - "Nada de systemd-timer nesta rodada; cron-manager cobre o caso principal via crontab."
  alternatives:
    - "Um único script 'multitool' — descartada: viola o princípio um script por ferramenta."
    - "Implementar só a Onda 1 — descartada: o pedido foi executar o P2."
    - "Usar inotifywait no file-watcher — descartada: dependência extra; polling com find/stat é suficiente."
    - "Usar qpdf/pdftk para PDF — descartada: pdfseparate/pdfunite já estão em poppler-utils e cobrem o caso."
  unknowns: |
    RESOLVIDO:
    1. video-to-text pode reutilizar video-to-audio e audio-to-text? → sim, com --output e --format.
    2. PDF: pdfseparate/pdfunite disponíveis? → sim.
    3. ImageMagick disponível? → sim (convert).
    4. Docker disponível para testar docker-doctor? → sim.
    5. PyYAML disponível para json-yaml-tool? → sim; fallback com erro acionável.
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  notes: >
    Cada script implementa o fluxo mínimo viável; flags extras só quando
    necessárias ao uso real. Sem biblioteca compartilhada nova.
  answered: true
  skipped: false
