task: harden-read-prompt
status: approved
domain: coding
done: "Hardening de 24 scripts dogu-sh (categorias A1+A2+B): todo prompt interativo passa a ter guard [ -t 0 ] antes do read; em execucao nao-tty chama error() com mensagem 'Execucao nao interativa detectada. Rode em terminal interativo (TTY) para confirmar.' e exit 1; SCRIPTING_GUIDE.md §5 e §15 ganham bullet canonizando a regra; verificado com smoke test via pty.fork + bash -n em todos os scripts alterados."
base_commit: "9ac4960156e082ce235b3fe6c851e8b706ad207b"
fit:
  trivial: false
  route: plan-first
  reason: "Inventário amplo (5+ scripts com 'read -r -p'), decisões de UX por tipo de prompt (instalação destrutiva vs confirmação de sobrescrita vs prompt informativo), edição sem alinhamento prévio introduz regressão. Plan-first para apresentar o inventário + propostas antes de tocar em código."
  answered: true
  skipped: false
think:
  problem: "31 scripts dogu-sh usam `read` para prompts ao usuario. Em execucoes nao-interativas (pipe, CI, cron, redirecionamento), esses prompts falham silenciosamente — variavel fica vazia, fallback `confirm=n` faz cancelar a operacao, e o usuario recebe `[SUCCESS]` falso OU `Operacao cancelada.` sem mover nada. O judge do kata detectou o mesmo bug no video-catalog-organizer.sh (resolvido); varrer o repo e corrigir os outros 30+ e' o escopo desta tarefa."
  assumptions:
    - "ASS-1: o usuario tipico do dogu-sh roda scripts em terminal interativo, mas o SCRIPTING_GUIDE.md §15 incentiva execucao via menu-launcher.sh e install-scripts.sh (que pode ser CI); portanto o caso nao-interativo e' real"
    - "ASS-2: o usuario nao quer flag --yes (YAGNI): o hardening deve apenas dar erro claro em modo nao-tty, sem adicionar nova flag. Quem quiser automatizar usa `expect` ou redireciona via `< /dev/tty`"
    - "ASS-3: o padrao canonico a ser aplicado em TODOS os scripts e' o mesmo que ja esta no video-catalog-organizer.sh (linhas 246-251): if [ -t 0 ]; then read ...; else error ...; fi"
    - "ASS-4: o escopo cobre categorias A1, A2 e B (todas com fallback destrutivo 'cancelar'). Categoria C (input livre sem fallback) e' fora do escopo desta task — bug diferente, pode ser PENDING para task futura"
    - "ASS-5: nenhum script tem dependencia circular entre arquivos que toque nesta varredura — cada script e' auto-contido (padrao dogu-sh), entao a edicao e' puramente local"
    - "ASS-6: as flags e o formato do prompt nao mudam — apenas o guard [ -t 0 ] e' adicionado"
  alternativas:
    - alt A: "introduzir uma variavel de ambiente DOGU_ASSUME_YES=1 que faz read aceitar 's' automaticamente — descartado: nova variavel de ambiente e' flag implicita; mesmo problema de --yes"
    - alt B: "criar helper read_prompt() em dependency-helper.sh que encapsula o guard — descartado: dependency-helper.sh ja tem seu proprio read (linha 21); o padrao dogu-sh prefere boilerplate explicito em cada script; helper esconde a logica de erro"
    - alt C: "documentar SCRIPTING_GUIDE §5 com o guard [ -t 0 ] e' obriga cada script novo a aplica-lo — insuficiente: nao corrige scripts ja existentes"
    - alt D: "padrao explicito if/then/else em cada script com mensagem de erro consistente — escolhido: alinha com o que ja esta no video-catalog-organizer.sh; mensagem 'Rode em terminal interativo (TTY) para confirmar.' fica canonica"
    - alt E: "forcar execucao interativa via `exec < /dev/tty` no inicio do script — descartado: invasivo; quebra scripts que NAO precisam de input (organize-downloads sem --dry-run)"
  unknowns:
    RESOLVIDO:
      - "Quantos scripts tem o bug? → 31 arquivos; 65+ ocorrencias"
      - "Quantas categorias distintas? → 5 (A1/A2/B/C/D); A1+A2+B somam ~40 ocorrencias problematicas"
      - "O bug e' mesmo em todos? → sim, todos usam < /dev/tty com fallback `confirm=n` ou sem /dev/tty com stdin"
      - "Existe teste automatizado? → nao"
    PENDENTE_USUARIO:
      Q1_escopo:
        escolha: "A) Hardening completo (categorias A1+A2+B)"
        arquivos_estimados: 24
        ocorrencias_estimadas: 35
      Q2_categoria_c:
        escolha: "A) Fica fora — task separada no futuro"
        motivo: "YAGNI: severidade menor (string vazia em vez de cancelamento); correcao desta task ja fecha os vetores destrutivos"
        registrado_em: "pending.action"
      Q3_mensagem_erro:
        escolha: "A) Execucao nao interativa detectada. Rode em terminal interativo (TTY) para confirmar."
        motivo: "Ja e' o que esta no video-catalog-organizer.sh; consistencia com script ja em producao"
      Q4_guardar_regra:
        escolha: "A) Só SCRIPTING_GUIDE.md §5 e §15"
        motivo: "Não existe .pre-commit-config.yaml nem .githooks/ no repo; adicionar hook seria escopo paralelo; SCRIPTING_GUIDE já é o repositório canonico de regras"
        alteracoes_previstas: "bullet em §5 (parsing de flags) + bullet em §15 (checklist)"
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  answered: true
  skipped: false
  notes: |
    Patch canonico tem 3-4 linhas (if/then/else); aplicado identico em 23 arquivos
    (cat A1+A2+B nao inclui o video-catalog-organizer.sh ja corrigido).
    Nao criar helper em dependency-helper.sh: dogu-sh prefere boilerplate explicito
    (regra do projeto: 1 ferramenta por script auto-contido).
    Nao adicionar flag --yes nem variavel de ambiente DOGU_ASSUME_YES: YAGNI
    (decisao do usuario Q4=A — so SCRIPTING_GUIDE.md).
    Escopo nao se estende para categoria C (input livre sem fallback): task separada.
    Caveat: 35 ocorrencias = 35 blocos if/then/else copiados. E' deliberado,
    nao acidente (ver THINK alt B).
intent:
  code_does: |
    23 scripts usam read -r para prompts. Em execucao nao-tty (pipe, CI, cron):
    - cat A1 (6 scripts): variavel vazia, comportamento indefinido
    - cat A2 (2 scripts): read -p < /dev/tty, variavel vazia
    - cat B (16 scripts, 27 ocorrencias): fallback confirm=n, "Operacao cancelada"
    O judge do video-catalog-organizer detectou exatamente esse padrao e corrigiu.
  check_expects: |
    Nao ha suite automatica dogu-sh. Verificacao equivalente (ja usada no judge da task
    anterior): pty.fork via python para alocar tty real + bash -n em todos os arquivos.
    Padrao de aceite: bash -n OK em todos os 24; pty test confirma fluxo interativo
    inalterado; pipe test confirma erro explicito com mensagem canonica.
  spec_says: |
    SCRIPTING_GUIDE.md §5: define apenas while/case para parsing (sem mencao a prompts).
    SCRIPTING_GUIDE.md §15 checklist: bullet "Confirmações no formato [s/N] com read -r"
    ATIVAMENTE prescricao o padrao problematico. Esta task ALTERA essa bullet para
    acrescentar o guard [ -t 0 ] antes do read. Nao ha conflito neste momento —
    a spec e' atualizada em paralelo com o codigo.
  all_agree: true
  conflict_resolution: ""
  resolved_by: "SCRIPTING_GUIDE.md §15 sera atualizado nesta task; nenhum conflito pre-existente"
  answered: true
  skipped: false
