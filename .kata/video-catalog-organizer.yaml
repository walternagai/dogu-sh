judge:
  verdict: "VERIFIED WITH CAVEATS"
  judged_at: "2026-08-23"
  re_execucao:
    bash_n: "OK"
    version: "video-catalog-organizer.sh 1.0.0"
    help: "OK"
    flag_obrigatoria_ausente: "exit=1"
    flag_invalida: "exit=1"
    flag_desconhecida: "exit=2"
    pasta_inexistente: "exit=1"
    smoke_interativo_pty: "OK (pty.fork) — dry-run nao move, --apply move"
  frauds_encontradas:
    - type: false_completion
      severity: high
      status: CORRIGIDA
      descricao: |
        Bug detectado pelo judge: o `read -r confirm < /dev/tty` herdado do
        padrao organize-downloads.sh aborta silenciosamente em execucoes
        nao-interativas (pipe, CI, cron) — o fallback `|| confirm="n"` faz
        cair no `*) Operacao cancelada.`, mascarando o --apply.
      evidencia: "Em pipe (`printf s | ./script`), [ -t 0 ] = false, /dev/tty nao existe; script retornava 'Operacao cancelada' sem mover nada."
      correcao: "Adicionada verificacao `[ -t 0 ]` antes do read; em execucao nao-interativa chama `error` (exit 1) com mensagem clara."
      validacao_pos_correcao: "Pipe agora retorna exit=1 com mensagem explicita; tty real via python pty.fork confirma dry-run nao move e --apply move os 3 arquivos para cursos/, filmes/, series/."
      regressao: "Comportamento interativo inalterado (tty real continua lendo < /dev/tty)."
  pontos_cego:
    - id: 5
      descricao: "Ancora refs/kata/base/9ac496... ausente; base_commit do YAML confia apenas no valor declarado. Sem ancora, juiz nao pode garantir que base_commit nao foi alterado mid-task. Para esta tarefa o diff e idempotente (HEAD == base_commit), mas em clone novo de tarefa antiga este ponto cego dispararia."
  notas:
    - "Fraude #2 high detectada e corrigida durante o judge — veredito final reflete o estado POS-correcao."
    - "Caveat: 'Catálogo de vídeo é problema aberto' do REPORT inicial permanece — heuristicas de --by content podem classificar errado nomes ambiguos (ex: 'Classe.2015.720p.mp4' foi para 'cursos/' por causa de 'classe'; isso e' debatível mas defensavel)."
