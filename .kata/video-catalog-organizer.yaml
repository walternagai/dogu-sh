think:
  problem: "Catálogos de vídeo pessoais (filmes, séries, cursos, clipes) tendem a crescer de forma caótica — nomes inconsistentes, extensões misturadas, sem agrupamento por temporada/qualidade/ano. O usuário precisa de UM script dogu-sh que receba uma pasta de vídeos e reorganize segundo uma estratégia explícita e segura (dry-run por padrão)."
  assumptions:
    - "ASS-1: a entrada é um diretório local com arquivos de vídeo identificáveis por extensão (.mp4 .mkv .avi .mov .webm .flv .wmv .m4v) — sem acesso a metadados remotos (TMDB/IMDB) na v1"
    - "ASS-2: o usuário prefere safe-by-default: sem flag de ação = só lista (dry-run); --apply efetiva os mv — difere do padrão organize-downloads.sh mas é justificado pelo tamanho alto dos arquivos de vídeo (10-80 GB comum em rips)"
    - "ASS-3: as estratégias de organização são mutuamente exclusivas por execução (uma flag --by X por chamada) — combinar duas estratégias cabe a execuções encadeadas, não ao mesmo script"
    - "ASS-4: --by quality usa regex no nome por padrão (sem dependência extra); ffprobe só roda sob --probe-quality"
    - "ASS-5: --by year prioriza regex no nome (ano de lançamento) e usa mtime como fallback; granularidade só ano (não ano/mês)"
    - "ASS-6: --by content classifica em 4 buckets fixos (filme, serie, curso, clipes) com fallback 'outros' — detecção por padrões no nome + (opcional) duração via ffprobe"
  decisions:
    Q1_escopo_v1:
      escolha: "B) Núcleo com 3 estratégias"
      estrategias_v1: ["content", "year", "quality"]
      fora_da_v1: ["ext", "similar", "duplicate", "size"]
      fora_da_v1_motivo: "YAGNI: cobre os 3 eixos mais pedidos (o quê/quando/quão bom); outras 4 ficam como roadmap"
    Q2_qualidade:
      escolha: "D) Só regex + --probe-quality opt-in"
      comportamento: "regex por padrão, ffprobe sob --probe-quality; dependência opcional"
    Q3_ano:
      escolha: "C) Nome com fallback mtime"
      comportamento: "regex no nome primeiro; mtime do arquivo como fallback; granularidade só ano"
      fallback: "ano do mtime, não ano/mês"
    Q4_movimentacao:
      escolha: "B) Default seguro: dry-run; --apply para mover"
      dry_run_default: true
      apply_flag: "--apply"
      quebra_simetria: "diferente de organize-downloads.sh; justificado pelo alto custo de mover arquivo de vídeo por engano"
  alternatives:
    - "alt A: um script por estratégia — descartado: quebra a regra dogu-sh de uma ferramenta por script"
    - "alt B: SQLite + TUI — descartado: fora do padrão dogu-sh (Bash sem DB)"
    - "alt C: TMDB/IMDB — descartado: requer chave de API, fora da v1"
    - "alt D: mover sem --dry-run — descartado: alto risco em arquivos grandes"
    - "alt E: hashing perceptual — descartado: pesado, baixa confiança na v1"
    - "alt F: granularidade ano/mês no mtime — descartado: cria estrutura profunda para arquivos onde o ano já vem do nome; granularidade ano/mês só vale quando o nome não tem data"
  unknowns:
    RESOLVIDO:
      - "Q1 escopo: 3 estratégias (content/year/quality)"
      - "Q2 qualidade: regex por padrão + ffprobe opt-in"
      - "Q3 ano: nome > mtime, granularidade só ano"
      - "Q4 movimentação: dry-run default + --apply"
    PENDENTE_FUTURO:
      - "Estratégias --by similar / duplicate / size: roadmap, não v1"
      - "Detecção de duplicatas por hash SHA-256 (coreutils): decidir se v2 combina com --by similar ou ganha --by duplicate próprio"
      - "Stemming para palavras similares (ex: casa/casas): só relevante se --by similar entrar; v2"
  answered: true
  skipped: false
simplify:
  minimum_code: true
  no_single_use_abstractions: true
  no_speculative_config: true
  answered: true
  skipped: false
  notes: |
    Plano já restrito pelas decisões Q1-Q4: 3 estratégias apenas (content/year/quality);
    nenhuma flag além das decididas (--by, --apply, --probe-quality, --recursive, --help, --version);
    sem --min-size/--exclude/--config-file;
    sem framework de plugins;
    detectores implementados como funções nomeadas (não classe genérica);
    trade-off explícito: opt-in por ffprobe evita dependência default.
    Caveat: organizar-downloads.sh deste repo tem --recursive; mantemos paridade.
    Caveat 2: organize-downloads.sh move por padrão; o usuário aceitou quebrar simetria aqui (PENDING registrado).
