findings:
  - id: P0-01
    severity: high
    title: "dogu --json quebra com SIGPIPE"
    evidence: "./dogu list --json | head -c 120 imprime traceback BrokenPipeError e suja o exit code."
    impact: "Pipelines de agentes e shell que limitam a saída do dispatcher recebem traceback."
    recommendation: "Restaurar SIGPIPE padrão nos snippets Python ou capturar BrokenPipeError e sair com 0."
    acceptance: "./dogu list --json | head -c 120 termina com 0 e stderr vazio."
  - id: P0-02
    severity: high
    title: "Dispatcher exige Python, instalador não verifica"
    evidence: "PATH restrito sem python → 'Python não encontrado'; install-scripts.sh copia dogu/dogu.json sem checar Python."
    impact: "Instalação bem-sucedida falha no primeiro comando em sistemas mínimos."
    recommendation: "Declarar/checar Python no instalador, criar fallback jq/awk ou adicionar dogu doctor."
    acceptance: "install-scripts --dry-run informa status de Python; dogu doctor existe; README lista a dependência."
  - id: P0-03
    severity: high
    title: "dogu-make-skill fora do manifesto/menu; SKILL.md ausente"
    evidence: "jq não encontra a entrada; grep no menu não encontra; arquivo SKILL.md não existe; script sem --version."
    impact: "Gerador invisível para agentes e menu; documentação promete artefato inexistente."
    recommendation: "Registrar no manifesto/menu, adicionar --version e versionar SKILL.md com verificação de diff."
    acceptance: "jq -e '.scripts[\"dogu-make-skill.sh\"]' dogu.json; --version funciona; SKILL.md existe e bate com --dry-run."
  - id: P0-04
    severity: high
    title: "Oito divergências entre manifesto e comportamento real"
    evidence: "brightness/dark-mode/docker-stats-history/ssh-tunnel-mgr/volume têm --dry-run não declarado; hunt-duplicates declara JSON sem --json; package-list-backup tem --json não declarado; video-catalog-organizer confunde dry-run padrão com flag."
    impact: "Agentes e usuários tomam decisões erradas sobre automação e segurança."
    recommendation: "Corrigir campos e definir has_dry_run = suporta --dry-run; dry_run_default separado."
    acceptance: "Verificador manifesto × flags reais retorna zero divergências."
  - id: P0-05
    severity: high
    title: "Dependências misturam binário, pacote, alternativa e Python"
    evidence: "brightness instala light+brightnessctl+xrandr; audio-to-text omite faster-whisper; media-control declara dbus-send e usa playerctl; xlsx-to-csv declara ssconvert e usa openpyxl; pdf-to-md omite pdftotext; env-keygen omite openssl; docker-compose-manager declara v1 e usa plugin."
    impact: "Instalações desnecessárias, falhas em runtime e dependency-checker enganoso."
    recommendation: "Adicionar deps_any, deps_python e deps_optional; manter deps como obrigatórios; atualizar dependency-checker."
    acceptance: "dependency-checker --all não tenta instalar alternativas simultaneamente; cada script declara o que bloqueia."
  - id: P0-06
    severity: high
    title: "Prompts interativos sem guard de TTY"
    evidence: "env-manager:137/147, lab-manager (67 reads) e menu-launcher:507/523 usam read -p sem [ -t 0 ]."
    impact: "Agentes e CI podem bloquear ou seguir com entrada vazia."
    recommendation: "Aplicar o padrão de dedup-files/docker-restore/folder-sync: [ -t 0 ] + erro explicativo em não interativo."
    acceptance: "timeout 3 ./env-manager.sh </dev/null retorna erro explicativo sem bloquear; idem lab-manager e menu-launcher."
  - id: P0-07
    severity: high
    title: "Cores ANSI vazam para pipes e logs"
    evidence: "./disk-space.sh | cat -v mostra escapes; dogu --help também coloriza quando redirecionado."
    impact: "Logs de CI e saída para agentes ficam poluídos; parsing quebra."
    recommendation: "Colorir só se [ -t 1 ] e NO_COLOR ausente; adicionar --no-color."
    acceptance: "./disk-space.sh | grep -c $'\\033' retorna 0; NO_COLOR e --no-color funcionam."
  - id: P0-08
    severity: high
    title: "--json cobre 26/105 e falta nos analíticos"
    evidence: "docker-image-slimmer, docker-logs-watcher, docker-stats-history, docker-volume-mgr, port-check, snap-flatpak-manager, speedtest-log, ssh-key-manager e wifi-scanner não têm --json."
    impact: "Agentes precisam parsear tabelas coloridas; automação fica frágil."
    recommendation: "Adicionar --json com schema mínimo comum, começando por port-check, docker-volume-mgr e ssh-key-manager."
    acceptance: "Cada candidato tem --json, jq . passa e o manifesto marca has_json: true."
clusters:
  - name: "quick-backup × folder-sync"
    evidence: "Jaccard de flags 0.64; ambos wrappers de rsync com --all, --compress, --dry-run, --exclude-from, --stats."
    decision: "unir"
    action: "Criar rsync-tool com --mode backup|sync|mirror|watch; manter nomes antigos como aliases."
  - name: "docker-backup × docker-restore × docker-volume-mgr"
    evidence: "volume-mgr já tem --backup e --restore; backup/restore operam volumes e containers."
    decision: "consolidar"
    action: "volume-mgr delega backup/restore; remover duplicação ou transformar em aliases."
  - name: "hunt-duplicates × dedup-files"
    evidence: "Mesmo domínio; 935 vs 357 linhas; hunt tem lixeira/restore/watch/cache; dedup tem algoritmo em estágios e --keep."
    decision: "unir a médio prazo"
    action: "Spike: dedup-files como preset seguro e hunt-duplicates como engine avançada, ou dedup com --mode fast|deep."
  - name: "archive-manager × unarchive"
    evidence: "archive-manager --unpack e unarchive extraem os mesmos formatos com implementações distintas."
    decision: "dividir responsabilidade"
    action: "archive-manager só compacta; --unpack delega a unarchive ou é depreciado."
  - name: "codebase-summary × context-gather"
    evidence: "Ambos varrem o projeto e emitem JSON para agentes; flags path/project e json."
    decision: "avaliar união parcial"
    action: "Testar context-gather --summary; se equivalente, unir; senão compartilhar biblioteca."
  - name: "env-manager × env-validator"
    evidence: "Nomes vizinhos, funções distintas: orquestração vs validação de .env."
    decision: "manter"
    action: "Documentar fronteira e adicionar --check/--install/--json ao env-manager."
  - name: "alarm × stopwatch × pomodoro-timer"
    evidence: "Modelos distintos: alarme por horário/duração, cronômetro crescente, ciclos Pomodoro."
    decision: "manter"
    action: "Extrair biblioteca de notificação/som e adicionar grupo dogu timer."
  - name: "disco: disk-space, disk-scanner, partitions-list, disk-health, dir-summary"
    evidence: "Funções complementares, não sobrepostas."
    decision: "manter"
    action: "Adicionar grupo dogu disk e padronizar --json/unidades."
  - name: "diagnóstico Docker: status, healthcheck, audit, cis, bottleneck"
    evidence: "Cinco diagnósticos complementares com cinco entrypoints."
    decision: "manter + agregador"
    action: "Novo docker-doctor que executa os cinco e resume."
  - name: "documentos: docx-to-md, pdf-to-md, pdf-to-jpg, jpg-to-text"
    evidence: "Pipeline de documentos com flags comuns de lote/recursivo."
    decision: "manter"
    action: "Compartilhar biblioteca de conversão/lote; novo pdf-split/pdf-merge."
  - name: "monolíticos: lab-manager, setup-workspace, hunt-duplicates, git-sync, package-list-backup"
    evidence: "2017, 1118, 935, 900 e 818 linhas, com múltiplas responsabilidades."
    decision: "dividir só por responsabilidade"
    action: "lab-manager: separar instaladores da UI; git-sync: extrair git-commit-ai; package-list-backup: separar export/import se os fluxos divergirem."
new_scripts:
  - name: video-to-text
    priority: 1
    gap: "Não existe pipeline vídeo → transcrição."
    composes_with: "video-to-audio + audio-to-text"
    why_not_flag: "Duas etapas com dependências distintas (ffmpeg + Whisper); exige encadeamento, limpeza e formato."
  - name: pdf-split / pdf-merge
    priority: 2
    gap: "Não há divisão/junção de PDF."
    composes_with: "pdf-to-jpg, pdf-to-md"
    why_not_flag: "Operações de página, não de conversão; pdftk/qpdf não estão expostos."
  - name: image-optimizer
    priority: 3
    gap: "Não há compressão/redimensionamento de imagens."
    composes_with: "screenshot, download-icons"
    why_not_flag: "Pós-processamento em lote, não captura/baixa."
  - name: ssl-cert-check
    priority: 4
    gap: "Não há verificação de validade/cadeia TLS."
    composes_with: "dns-lookup, port-check, whois"
    why_not_flag: "Diagnóstico de certificado, não de DNS/porta."
  - name: docker-doctor
    priority: 5
    gap: "Cinco comandos de diagnóstico sem visão agregada."
    composes_with: "docker-status, docker-healthcheck, docker-audit, docker-cis-benchmark, docker-bottleneck-detect"
    why_not_flag: "Agrega e prioriza; não substitui os detalhes."
  - name: json-yaml-tool
    priority: 6
    gap: "Não há validação/formatação/consulta de JSON/YAML."
    composes_with: "base64-tool, conversores"
    why_not_flag: "Ferramenta de dados, não de codificação."
  - name: cron-manager / systemd-timer
    priority: 7
    gap: "Não há agendamento persistente."
    composes_with: "alarm, pomodoro-timer"
    why_not_flag: "Alarme é sessão; cron/systemd é persistência."
  - name: http-server
    priority: 8
    gap: "Não há servidor local de diretório."
    composes_with: "port-check, api-tester"
    why_not_flag: "Serving não é teste de API."
  - name: dotfiles-manager
    priority: 9
    gap: "Não há gestão de dotfiles."
    composes_with: "setup-workspace, package-list-backup"
    why_not_flag: "Backup de pacotes não versiona configurações."
  - name: file-watcher
    priority: 10
    gap: "Observação de arquivos só existe dentro de folder-sync --watch."
    composes_with: "folder-sync, quick-backup"
    why_not_flag: "Watcher genérico serve a múltiplos fluxos, não só rsync."
caveats:
  - "A triagem não leu linha a linha os 35.372 LOC; o deep dive cobriu os clusters e os scripts de maior risco."
  - "Não houve teste end-to-end de cada ferramenta em todas as plataformas."
  - "A nota de higiene mede contrato de CLI, não qualidade intrínseca; há efeito-teto (83/105 em 9–10)."
  - "Não houve estudo com usuários; as recomendações vêm de evidência de código e comportamento observável."
