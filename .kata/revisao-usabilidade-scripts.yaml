think:
  problem: >
    O dōgu-sh tem 105 scripts e 35.372 LOC, mas não há uma visão integrada de
    usabilidade, sobreposição funcional e lacunas de portfólio. O manifesto e o
    README prometem contratos que o código nem sempre cumpre, e há clusters de
    scripts que resolvem o mesmo problema com interfaces diferentes. Sem esse
    diagnóstico, melhorias ficam reféns de achismo e o portfólio cresce por
    acumulação, não por composição.
  assumptions:
    - "O princípio 'um script por ferramenta' do AGENTS.md deve ser preservado; unir só quando o resultado for uma ferramenta coerente."
    - "Compatibilidade retroativa importa: nomes antigos devem continuar funcionando como alias ou depreciação."
    - "A triagem automatizada de 105 scripts é suficiente para priorizar; deep dive fica nos clusters e nos scripts de maior risco."
    - "Scripts novos só entram com lacuna de fluxo comprovada e composição explícita com ferramentas existentes."
    - "Nenhuma alteração de produção deve ser feita nesta task."
  alternatives:
    - "Auditoria linha a linha dos 105 scripts — descartada: custo alto e retorno decrescente para scripts isolados."
    - "Revisar só os clusters de sobreposição — descartada: deixaria passar metadados e contratos quebrados em scripts isolados."
    - "Corrigir os achados durante a revisão — descartada: mistura diagnóstico com implementação e impede priorização pelo usuário."
    - "Triagem 105/105 + deep dive nos clusters + relatório priorizado — escolhida: cobre o portfólio e mantém o diff de produção vazio."
  unknowns: |
    RESOLVIDO:
    1. Quantos scripts existem? → 105 .sh, 104 no manifesto, 104 no menu, 105 no README.
    2. O manifesto está correto? → não; 8 divergências de campos e 7 divergências de dependências.
    3. Há sobreposição real? → sim; 11 clusters avaliados, com evidência de flags e código.
    4. Quais scripts novos fazem sentido? → 10 propostas, 5 priorizadas, todas com composição explícita.
    NÃO BLOQUEIA: a profundidade de implementação de cada proposta será decidida em tasks de follow-up.
  answered: true
  skipped: false
