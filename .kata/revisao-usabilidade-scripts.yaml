task: revisao-usabilidade-scripts
status: approved
domain: coding
done: >
  Relatório de revisão do portfólio dos 105 scripts que: (1) aplica triagem de
  usabilidade a 100% dos scripts; (2) avalia 11 clusters com sobreposição
  funcional e emite veredito manter/unir/dividir/alias; (3) propõe scripts
  novos apenas quando há lacuna de fluxo comprovada e composição com
  ferramentas existentes; (4) reconcilia manifesto, disco, menu, README e
  SKILL.md; (5) entrega backlog priorizado P0/P1/P2 com evidência reproduzível
  e critério de aceite por item; (6) não altera código de produção.
