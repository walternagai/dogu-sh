task: fix-dependency-auto-install
status: approved
domain: coding
done: "check_and_install aceita 3º arg opcional (nome do pacote), anexa o pacote ao comando de instalação (eval \"$install_cmd $pkg\"), e chamadas de 3 args passam a instalar corretamente (apt-get recebe o pacote) — verificado por teste empírico com echo simulando o instalador"
base_commit: "28fe79eb12ebf000a44c23494866cba46b32ca0e"
fit:
  trivial: false
  route: question
  reason: "Usuário pediu revisão de por que dependências não instalam automaticamente; diagnóstico primeiro, correção depende de aprovação. Diagnóstico entregue e usuário autorizou a correção (user_approved: true) — prossegue como code-loop com autorização."
  answered: true
  skipped: false
question:
  question: "Por que scripts com dependências não instalam de forma automática?"
  findings: |
    - dependency-helper.sh define check_and_install(pkg_name, install_cmd) — aceita só 2 args
    - 65 scripts chamam com 3 args: check_and_install "docker" "$INSTALLER" "docker.io"
    - O 3º arg (nome do pacote) é IGNORADO pela função
    - Quando a dependência falta, roda `eval "sudo apt-get install -y"` SEM o pacote
    - apt-get sem pacote falha ("You must specify at least one package") → instalação nunca acontece
    - Confirmado empiricamente: check_and_install "comando-inexistente-xyz" "echo sudo apt-get install -y" "docker.io" roda o comando sem o pacote
    - Exceção que funciona: currency-converter.sh:89 embute o pacote no 2º arg: check_and_install jq "$(detect_installer) jq"
    - dependency-checker.sh --fix usa $INSTALLER "$pkg" corretamente (não afetado)
  recommendation: "Corrigir check_and_install para aceitar 3º arg opcional (nome do pacote) e anexá-lo ao install_cmd: eval \"$install_cmd $pkg\". Corrige os 65 scripts de uma vez, sem tocar em cada chamada. O padrão de 2 args (currency-converter jq) continua funcionando."
  action_taken: true
  user_approved: true
think:
  problem: "check_and_install() em dependency-helper.sh aceita só 2 args (pkg_name, install_cmd), mas 65 scripts chamam com 3 args (pkg_name, install_cmd, pacote). O 3º arg é silenciosamente ignorado e a instalação roda sem o pacote, falhando (apt-get sem pacote) e reportando falso [SUCCESS]."
  assumptions:
    - "Todos os 65 scripts chamadores seguem o padrão de 3 args com o pacote no 3º arg (verificado: 63 arquivos, 86 chamadas, padrão dominante)"
    - "O padrão de 2 args (currency-converter.sh:89, pacote embutido no 2º arg) deve continuar funcionando"
    - "Anexar o pacote ao final do install_cmd é seguro para todos os instaladores suportados (apt-get, pacman, dnf, brew — todos aceitam pacote como último arg)"
    - "Nenhum script chama check_and_install com 3 args onde o 3º arg NÃO seja o nome do pacote"
  alternatives:
    - "alt A: corrigir os 65 scripts chamadores individualmente — descartado: 65 edições, alto risco de erro, diff enorme"
    - "alt B: corrigir a função para aceitar 3º arg opcional e anexá-lo — escolhido: 2 linhas, corrige todos os callers de uma vez, retrocompatível com 2 args"
    - "alt C: mudar a assinatura para exigir 3 args — descartado: quebraria currency-converter.sh:89 (2 args com pacote embutido)"
  unknowns: |
    RESOLVIDO:
    1. Quantos scripts chamam com 3 args? → 63 arquivos, 86 chamadas (rg)
    2. Existe outra definição de check_and_install? → Não, só dependency-helper.sh:6
    3. dependency-checker.sh é afetado? → Não, usa $INSTALLER "$pkg" diretamente
    4. O 3º arg é sempre o nome do pacote? → Sim, confirmado em amostras (docker.io, poppler-utils, jq, curl)
  answered: true
  skipped: false
